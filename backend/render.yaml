services:
  - type: web
    name: acg-backend
    env: python
    region: oregon
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        value: "https://sdmvjjvvzbwnccwaeomh.supabase.co"
      - key: SUPABASE_ANON_KEY
        value: "ACG_COMMITTED_ANON_KEY_PURGED"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_AI_STUDIO_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: FRONTEND_URLS
        value: "http://localhost:3000,https://advanced-code-garage-rgke.vercel.app,https://advanced-code-garage.vercel.app"
      - key: ENVIRONMENT
        value: "production"
