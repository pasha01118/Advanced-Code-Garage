name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        shell: bash
        run: |
          URL="https://agc-backend-ix19.onrender.com/health"
          for attempt in 1 2 3 4; do
            RESPONSE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "CURL_FAILED")
            echo "Attempt $attempt -> HTTP $RESPONSE"
            if [ "$RESPONSE" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Warning: backend did not respond 200 after 4 attempts"
              exit 0
            fi
            sleep 30
          done